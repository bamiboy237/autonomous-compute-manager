ClusterName=acmdev
SlurmctldHost=slurmctld
SlurmUser=slurm
AuthType=auth/munge
AuthAltTypes=auth/jwt
AuthAltParameters=jwt_key=/etc/slurm/jwt_hs256.key

StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd
SlurmctldPidFile=/run/slurmctld.pid
SlurmdPidFile=/run/slurmd.pid
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log
SlurmctldDebug=info
SlurmdDebug=info

# Containers share the host kernel and have no delegated cgroup tree.
ProctrackType=proctrack/linuxproc
TaskPlugin=task/none
JobAcctGatherType=jobacct_gather/linux
JobAcctGatherFrequency=10

SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_Core
ReturnToService=2

AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageHost=slurmdbd
AccountingStorageEnforce=associations,limits,qos
AccountingStorageTRES=gres/gpu,gres/gpu:a100,gres/gpu:h100
JobCompType=jobcomp/none

GresTypes=gpu
MpiDefault=none
MailProg=/bin/true
KillWait=5
MinJobAge=300

NodeName=c1 CPUs=2 RealMemory=1024 Gres=gpu:a100:2 State=UNKNOWN
NodeName=c2 CPUs=2 RealMemory=1024 Gres=gpu:h100:1 State=UNKNOWN

PartitionName=debug Nodes=c[1-2] Default=YES MaxTime=00:10:00 DefaultTime=00:05:00 QOS=debug State=UP
PartitionName=gpu Nodes=c[1-2] MaxTime=04:00:00 DefaultTime=01:00:00 State=UP
