[project]
name = "acm-storage"
version = "0.1.0"
description = "Object store client, content addressing and checkpoint manifests."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "acm-core",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acm_storage"]

[tool.uv.sources]
acm-core = { workspace = true }
