[project]
name = "acm-eval"
version = "0.1.0"
description = "Baselines, benchmark harness and agent replay evaluation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "acm-core",
    "acm-worker",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acm_eval"]

[tool.uv.sources]
acm-core = { workspace = true }
acm-worker = { workspace = true }
