[project]
name = "acm-agents"
version = "0.1.0"
description = "Pydantic AI agents, tools, policies and model registry."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "acm-core",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acm_agents"]

[tool.uv.sources]
acm-core = { workspace = true }
