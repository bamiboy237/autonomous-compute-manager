[project]
name = "acm-cli"
version = "0.1.0"
description = "acmctl command-line interface."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "acm-core",
]

[project.scripts]
acmctl = "acm_cli.main:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acm_cli"]

[tool.uv.sources]
acm-core = { workspace = true }
