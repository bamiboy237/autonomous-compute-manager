[project]
name = "acm-core"
version = "0.1.0"
description = "Shared settings, ids, domain models, database and event schemas."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "pgvector>=0.5.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "python-ulid>=4.0.1",
    "sqlalchemy[asyncio]>=2.1.6",
    "structlog>=26.1.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acm_core"]
