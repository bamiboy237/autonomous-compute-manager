[project]
name = "acm-api"
version = "0.1.0"
description = "FastAPI control-plane API."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "acm-core",
    "acm-telemetry",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acm_api"]

[tool.uv.sources]
acm-core = { workspace = true }
acm-telemetry = { workspace = true }
