[project]
name = "acm-providers"
version = "0.1.0"
description = "Provider interface, capability model and compute adapters."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "acm-core",
    "pydantic>=2.14",
]

[project.optional-dependencies]
testing = [
    "pytest>=9.0",
    "pytest-asyncio>=1.4",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acm_providers"]

[tool.uv.sources]
acm-core = { workspace = true }
