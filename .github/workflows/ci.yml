name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-packages --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - uses: actions/setup-go@v5
        with:
          go-version-file: edge/go.mod
          cache: false
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0
          working-directory: edge

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-packages --locked
      - run: uv run pytest -m "not integration and not slurm"

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: edge/go.mod
          cache: false
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: extractions/setup-just@v3
      - run: uv sync --all-packages --locked
      - run: just up
      - run: just test-integration
      - if: failure()
        run: docker compose -f deploy/compose/compose.yaml logs --no-color || true
      - if: always()
        run: just down -v
